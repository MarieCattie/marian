<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rosa ART — кейс бренд-дизайна студии декорированных и накладных ногтей." />
  <title>Rosa ART — Brand Design Case</title>
  <style>
    :root {
      --bg: #f8f6f7;
      --surface: rgba(255, 255, 255, 0.78);
      --line: rgba(86, 78, 82, 0.14);
      --text: #33343a;
      --muted: #8b8a91;
      --pink: #e9b8c7;
      --pink-deep: #c9869e;
      --shadow: 0 24px 70px rgba(98, 81, 88, 0.14);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(236, 191, 207, 0.2), transparent 28%),
        radial-gradient(circle at 88% 20%, rgba(216, 216, 220, 0.42), transparent 26%),
        linear-gradient(180deg, #fff, var(--bg));
      min-height: 100vh;
    }

    .page {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 22px;
      margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 14px;
      z-index: 10;
      box-shadow: 0 12px 40px rgba(87, 75, 80, 0.08);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand strong {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 500;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand span {
      color: var(--pink-deep);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .tag {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .case-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .case-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
      border-radius: inherit;
      z-index: 2;
    }

    .case-image {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      padding: 22px 6px 6px;
      letter-spacing: 0.04em;
    }

    .footer a {
      color: var(--pink-deep);
      text-decoration: none;
    }

    @media (max-width: 720px) {
      .page { padding: 10px; }
      .topbar {
        position: static;
        padding: 14px 16px;
        border-radius: 16px;
      }
      .brand { display: block; }
      .brand span { display: block; margin-top: 4px; }
      .tag { display: none; }
      .case-frame { border-radius: 16px; }
      .footer { display: block; text-align: center; line-height: 1.7; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <strong>Rosa ART</strong>
        <span>brand design case</span>
      </div>
      <div class="tag">Накладные ногти · Декор · Creative nail art</div>
    </header>

    <section class="case-frame" aria-label="Кейс брендинга Rosa ART">
      <img
        class="case-image"
        src="rosa-art-case.png"
        alt="Длинная презентация бренд-дизайна студии декорированных ногтей Rosa ART"
      />
    </section>

    <footer class="footer">
      <span>Rosa ART — минималистичная айдентика студии декорированных ногтей</span>
      <a href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Наверх ↑</a>
    </footer>
  </main>
</body>
</html>
