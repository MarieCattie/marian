<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pricing card — пример вёрстки</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#4F46E5', hover: '#4338CA' },
            surface: { DEFAULT: '#FFFFFF', dark: '#111827' },
            muted:   { DEFAULT: '#6B7280', dark: '#9CA3AF' },
            border:  { DEFAULT: '#E5E7EB', dark: '#1F2937' },
          },
          borderRadius: { xl2: '1rem' },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    :root {
      --color-primary: #4F46E5;
      --color-surface: #FFFFFF;
      --color-muted: #6B7280;
      --color-border: #E5E7EB;
    }
    .dark {
      --color-primary: #6366F1;
      --color-surface: #111827;
      --color-muted: #9CA3AF;
      --color-border: #1F2937;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans antialiased p-6 md:p-12">

  <!-- Переключатель темы -->
  <button
    id="themeToggle"
    type="button"
    aria-label="Переключить тему"
    class="mb-6 inline-flex items-center gap-2 rounded-lg border border-[var(--color-border)]
           px-3 py-2 text-sm text-[var(--color-muted)] transition
           hover:border-[var(--color-primary)] hover:text-[var(--color-primary)]
           focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-primary)] focus-visible:ring-offset-2">
    <span aria-hidden="true">◐</span> Тема
  </button>

  <!-- Карточка тарифа -->
  <section class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 max-w-6xl mx-auto">

    <article
      class="group flex flex-col rounded-xl2 border border-[var(--color-border)]
             bg-[var(--color-surface)] p-6 shadow-sm transition
             hover:-translate-y-0.5 hover:shadow-md
             focus-within:ring-2 focus-within:ring-[var(--color-primary)]"
      aria-labelledby="plan-pro">

      <header class="mb-4">
        <h2 id="plan-pro" class="text-lg font-semibold text-gray-900 dark:text-gray-100">Pro</h2>
        <p class="mt-1 text-sm text-[var(--color-muted)]">Для растущих команд</p>
      </header>

      <p class="mb-6">
        <span class="text-3xl font-bold text-gray-900 dark:text-gray-100">$29</span>
        <span class="text-sm text-[var(--color-muted)]">/мес</span>
      </p>

      <ul class="mb-6 space-y-2 text-sm text-[var(--color-muted)]" role="list">
        <li class="flex items-center gap-2"><span aria-hidden="true">✓</span> Неограниченные проекты</li>
        <li class="flex items-center gap-2"><span aria-hidden="true">✓</span> Совместная работа</li>
        <li class="flex items-center gap-2"><span aria-hidden="true">✓</span> Приоритетная поддержка</li>
      </ul>

      <button
        type="button"
        class="mt-auto w-full rounded-lg bg-[var(--color-primary)] px-4 py-2.5
               text-sm font-medium text-white transition
               hover:bg-primary-hover
               focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2
               focus-visible:ring-[var(--color-primary)]
               active:scale-[0.99]">
        Выбрать тариф
      </button>
    </article>

  </section>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      root.classList.toggle('dark');
      root.classList.toggle('light');
      localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
    });
    if (localStorage.getItem('theme') === 'dark') {
      root.classList.add('dark');
      root.classList.remove('light');
    }
  </script>
</body>
</html>
